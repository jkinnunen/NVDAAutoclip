name: CI and release add-on

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Compile Python code
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          uv run --frozen python -m py_compile buildVars.py sconstruct
          uv run --frozen python -m compileall -q addon site_scons
      - name: Run Ruff
        run: uv run --frozen ruff check .
      - name: Validate translations
        run: |
          find addon/locale -type f -name '*.po' -print0 | while IFS= read -r -d '' po_file; do
            msgfmt --check --check-header --output-file=/dev/null "$po_file"
          done
      - name: Build add-on and translation template
        run: |
          uv run --frozen scons
          uv run --frozen scons pot
      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          import itertools
          import re
          pattern = r"^## v\d\.\d\.\d"
          with open("changelog.md", "r", encoding="UTF-8") as changelog:
              contents = changelog.read()
          matches = tuple(
              itertools.islice(re.finditer(pattern, contents, re.MULTILINE | re.IGNORECASE), 2)
          )
          release_notes = contents[matches[0].start():matches[1].start() - 1].strip() + "\n"
          with open("release_description.md", "w", encoding="UTF-8") as description:
              description.write(release_notes)
        shell: python
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            *.nvda-addon
            *.pot
            release_description.md
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
          "*.nvda-addon" "*.pot" \
          --title "${{ github.ref_name }}" \
          --notes-file "release_description.md" \
          --verify-tag
